name: E2E

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  main-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: repomedic_user
          POSTGRES_PASSWORD: repomedic_password
          POSTGRES_DB: repomedic_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repomedic_user -d repomedic_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      AUTH_PROVIDER: development
      DATABASE_URL: postgresql+psycopg2://repomedic_user:repomedic_password@localhost:5432/repomedic_db
      GITHUB_APP_ID: "12345"
      GITHUB_APP_SLUG: test-app
      GITHUB_APP_PRIVATE_KEY: test-pem
      GITHUB_APP_WEBHOOK_SECRET: test-secret
      AI_CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SESSION_SECRET_KEY: e2e-only-session-secret
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Migrate E2E database
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Start backend
        run: |
          nohup python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/repomedic-backend.log 2>&1 < /dev/null &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/repomedic-backend.log
          exit 1
      - name: Run development-adapter E2E suite without Clerk configuration
        working-directory: frontend
        run: npm run test:e2e

  clerk-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: repomedic_user
          POSTGRES_PASSWORD: repomedic_password
          POSTGRES_DB: clerk_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repomedic_user -d clerk_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      CLERK_E2E_DATABASE_URL: postgresql+psycopg2://repomedic_user:repomedic_password@localhost:5432/clerk_e2e
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
      CLERK_E2E_EMAIL: ${{ secrets.CLERK_E2E_EMAIL }}
      CLERK_E2E_PASSWORD: ${{ secrets.CLERK_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run isolated Clerk E2E suite
        working-directory: frontend
        run: npm run test:e2e:clerk